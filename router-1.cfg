interface Loopback0
 ip address 172.16.1.1 255.255.255.255
 ip router ISIS CYBER

interface Gig0/0
 ip address 10.0.12.0 255.255.255.254
 mpls ip
 ip router isis CYBER
 no shutdown

interface Gig0/1
 ip address 10.0.14.0 255.255.255.254
 mpls ip
 ip router isis CYBER
 no shutdown
 
router isis CYBER
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 metric-style wide
